name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: lab7/assignment-01/lab5/package-lock.json

      - name: Install dependencies and Run ESLint
        run: |
          npm install
          npx eslint .
        working-directory: lab7/assignment-01/lab5

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: lab7/assignment-01/lab5/package-lock.json

      - name: Install dependencies and Run unit tests
        run: |
          npm install
          npx jest
        working-directory: lab7/assignment-01/lab5

  integration-tests:
    runs-on: ubuntu-latest
    needs: [lint-code, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/setup-buildx-action@v3

      - name: Run local AWS and Hurl Integration Tests
        run: |
          chmod +x scripts/local-aws-setup.sh
          ./scripts/local-aws-setup.sh
        working-directory: lab7/assignment-01/lab5